[project]
name = "triage-iq"
version = "0.1.0"
description = "AI-powered ticket classification, routing, and auto-resolution engine."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "langchain>=1.4.0",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.2",
    "langchain-pinecone>=0.2.13",
    "langchain-text-splitters>=1.1.2",
    "pinecone>=7.3.0",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "sentence-transformers>=6.0.1",
    "sqlalchemy>=2.0.52",
    "supabase>=2.31.0",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/triage_iq"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
